name: folium
description: Folium — offline-first notes, 100% local, zero network, 120 FPS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management - minimal rebuilds
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database - Isar v3 (zero-copy, ACID, isolates, FTS)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # UI - Masonry grid & Material 3
  flutter_staggered_grid_view: ^0.7.0

  # Local filesystem only (offline)
  image_picker: ^1.1.2
  path: ^1.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
